name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src tests main.py eval/run.py eval/databricks/submit-tests.py eval/phoenix
      - run: uv run --locked ruff format --check src tests main.py eval/run.py eval/databricks/submit-tests.py eval/phoenix
      - run: uv run --locked pytest tests -q --junitxml=test-results.xml
      - run: uv run --locked pytest eval/harness/tests -q -o pythonpath=eval/harness
      - run: uv run --locked python eval/phoenix/create_dataset.py --dry-run
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
